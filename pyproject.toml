[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ugarit-context-parsing"
version = "0.2.0"
description = "Extract Burns Ugaritic contextual data and materialize it as Text-Fabric"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "text-fabric>=13.1,<14",
  "pdfplumber>=0.11",
  "cryptography<46.0.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
ugarit-context-parsing = "ugarit_context_parsing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ugarit_context_parsing", "scripts"]
