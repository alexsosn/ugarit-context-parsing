name: Issue 31 A-only structural audit

on:
  pull_request:
    paths:
      - 'research/issue-31/audit_a_only_lines.py'
      - '.github/workflows/research-a-only-31.yml'
      - 'tests/test_ci_action_pins.py'

permissions:
  contents: read

concurrency:
  group: issue-31-a-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify CI provenance
        run: python scripts/check_ci_provenance.py

      - name: Install parser runtime
        run: python -m pip install .

      - name: Run aggregate-only A-only structural audit
        run: python research/issue-31/audit_a_only_lines.py

      - name: Assert no Burns-derived source persisted
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Workbooks
          test ! -e research/issue-31/audit.json
