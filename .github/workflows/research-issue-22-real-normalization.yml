name: Issue 22 real normalization audit

on:
  pull_request:
    paths:
      - 'src/ugarit_context_parsing/annotations.py'
      - 'research/issue-22/audit_real_normalization.py'
      - '.github/workflows/research-issue-22-real-normalization.yml'
      - 'tests/test_ci_action_pins.py'

permissions:
  contents: read

concurrency:
  group: issue-22-real-normalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Burns normalizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify CI provenance
        run: python scripts/check_ci_provenance.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Validate production normalization on checksum-pinned Workbooks
        run: python research/issue-22/audit_real_normalization.py

      - name: Assert no Burns-derived source or output persisted
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Workbooks
          test ! -e output/issue-22
          test ! -e research/issue-22/latest-stats.json
