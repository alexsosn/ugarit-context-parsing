name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and runtime dependencies
        run: python -m pip install .
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Verify installed package outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib
          import pathlib
          import ugarit_context_parsing.cli
          parser = importlib.import_module('scripts.parse_workbooks_to_csv')
          assert callable(parser.parse_pdf)
          assert 'ugarit-context-parsing' not in str(pathlib.Path(parser.__file__).resolve())
          PY

  agora-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out materializer repository
        uses: actions/checkout@v4
      - name: Check out pinned Agora contract
        uses: actions/checkout@v4
        with:
          repository: alexsosn/Agora
          ref: 122b27d9326a57f464a7ce6f610385e6d6182999
          path: .agora-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Agora manifest validator dependency
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Validate manifest with Agora runtime semantics
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('.agora-contract').resolve()))
          from scripts.agora_materialize import load_manifest

          manifest = load_manifest(Path('agora.materializer.json'))
          assert manifest['plugin']['id'] == 'ugarit-context-parsing'
          assert [item['id'] for item in manifest['materializers']] == [
              'burns-workbooks-csv-text-fabric',
              'burns-workbooks-pdf-text-fabric',
          ]
          PY
