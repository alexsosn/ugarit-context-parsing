name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and runtime dependencies
        run: python -m pip install .
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Verify installed package outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib
          import pathlib
          import ugarit_context_parsing.cli
          parser = importlib.import_module('scripts.parse_workbooks_to_csv')
          assert callable(parser.parse_pdf)
          assert 'ugarit-context-parsing' not in str(pathlib.Path(parser.__file__).resolve())
          PY
