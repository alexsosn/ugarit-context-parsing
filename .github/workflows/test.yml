name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and runtime dependencies
        run: python -m pip install .
      - name: Record execution environment
        run: |
          python - <<'PY'
          import hashlib
          import json
          import platform
          import sys
          from importlib import metadata

          packages = sorted(
              f"{name.casefold()}=={dist.version}"
              for dist in metadata.distributions()
              if (name := dist.metadata.get("Name"))
          )
          evidence = {
              "python_version": sys.version,
              "python_implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "system": platform.system(),
              "release": platform.release(),
              "machine": platform.machine(),
              "packages": packages,
          }
          canonical = json.dumps(
              evidence,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          )
          print("execution_environment=" + canonical)
          print(
              "execution_environment_sha256="
              + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          )
          PY
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Verify installed package outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib
          import pathlib
          import ugarit_context_parsing.cli
          parser = importlib.import_module('scripts.parse_workbooks_to_csv')
          assert callable(parser.parse_pdf)
          assert 'ugarit-context-parsing' not in str(pathlib.Path(parser.__file__).resolve())
          PY

  agora-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out materializer repository
        uses: actions/checkout@v4
      - name: Check out pinned Agora contract
        uses: actions/checkout@v4
        with:
          repository: alexsosn/Agora
          ref: 807db7dcdf09f1aaaae04a7a6a19f193d22af4b9
          path: .agora-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Agora manifest validator dependency
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Validate manifest with Agora runtime semantics
        working-directory: .agora-contract
        run: |
          python - <<'PY'
          from pathlib import Path

          from scripts.agora_materialize import load_manifest

          manifest = load_manifest(Path('../agora.materializer.json'))
          assert manifest['plugin']['id'] == 'ugarit-context-parsing'
          assert [item['id'] for item in manifest['materializers']] == [
              'burns-workbooks-csv-text-fabric',
              'burns-workbooks-pdf-text-fabric',
          ]
          PY
