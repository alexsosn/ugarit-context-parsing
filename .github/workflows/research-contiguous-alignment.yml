name: Burns contiguous alignment audit

on:
  pull_request:
    paths:
      - 'research/issue-21/analyze_real_source_contiguous.py'
      - '.github/workflows/research-contiguous-alignment.yml'
      - 'tests/test_ci_action_pins.py'

permissions:
  contents: read

concurrency:
  group: burns-contiguous-alignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Burns research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify CI provenance
        run: python scripts/check_ci_provenance.py

      - name: Check out reviewed CUC base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DT-UCPH/cuc
          ref: ad69400f5446e1c8217af01659c7c10ab00c015b
          path: .cuc

      - name: Install parser and Text-Fabric runtime
        run: python -m pip install .

      - name: Run corrected aggregate-only alignment probe
        run: >-
          python research/issue-21/analyze_real_source_contiguous.py
          --cuc-tf .cuc/tf/0.2.8

      - name: Assert no Burns-derived source or output persisted
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Workbooks
          test ! -e output/issue-21
          test ! -e research/issue-21/latest-stats.json
